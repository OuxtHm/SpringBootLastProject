name: Deploy to Ubunto Server

on:
  push:
    branches: 
      - main  # main branch에서 commit이 있는 경우

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 코드 체크아웃
    - name: Checkout repository
    - uses: actions/checkout@v2


    # JDK 17 설정
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'

    # gradle 권한 부여
    - name: Setup gradlew permissions
      run: |
        chmod +x ./gradlew

    # gradle build
    - name: Build with Gradle
      run: ./gradlew build
      
    - name: Set SSH key permission
      run : |
        mkdir -p ~/.ssh
        echo "${{secrets.SERVER_SSH_KEY}}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
    - name: Add SSH Key
      uses: webfactory/ssh-agent@0.5.3
      with:
        ssh-private -key: ${{secrets.SERVER_SSH_KEY}}
    - name: Add known_hosts
      run: |
        ssh-keygen -t rsa 13.125.118.125 >> ~/.ssh/know_hosts
    - name: Deploy to Server with rsync 
      run: |
        rsync -avz -e "ssh -o StrictHostKeyChecking=no" build/libs/*.war ubuntu@13.125.118.125:~/app

    - name: Run SSH commands
      run: |
        ssh -i ~/.ssh/id_rsa ubuntu@13.125.118.125:~/app << 'EOF'
          pkill -f 'java -jar'|| true
          nohup java -jar ~/app/SpringBootLastProject-0.0.1-SNAPSHOT.war > log.txt> &1 &EOF
