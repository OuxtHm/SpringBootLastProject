# Git Action Depoly

name: Deploy to Docker Server to Ubuntu Server

#연동
on:
  push:
    branches:
      - main  # main 브랜치에 푸시될 때 트리거 (Commit/Push)

jobs:
  deploy:
    runs-on: ubuntu-latest #ubuntu 최종버전

    steps:
      # 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v3

      # JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # gradlew 권한 설정
      - name: Set gradlew permissions
        run: |
          chmod +x ./gradlew

      # gradle 빌드
      # war 파싱 = clean => 다시 빌드
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Login to DockerHub
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERBUB_USERNAME }}" --password-stdin

      - name: Docker
        run: |
          docker build -t ${{ secrets.DOCKERBUB_USERNAME }}/spring-boot-app:latest .
          docker push ${{ secrets.DOCKERBUB_USERNAME }}/spring-boot-app:latest

      # SSH : 암호화 통신 => 개인 키를 가지고 AWS에 접속
      - name: Add SSH Key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}
          #등록 => 서버키 등록

      - name: Add known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 43.201.115.160 >> ~/.ssh/known_hosts

      # 실행 코드
      # 정지 => docker stop image명
      # 삭제 => docker rm image명
      - name: Deploy on Server using Docker Hub image
        run: |
          ssh ubuntu@43.201.115.160 << 'EOF'
            sudo docker stop spring-app || true
            sudo docker rm spring-app || true
            sudo docker pull ${{ secrets.DOCKERBUB_USERNAME }}/spring-boot-app:latest
            sudo docker run -d --name spring-app --restart always -p 8080:8080 ${{ secrets.DOCKERBUB_USERNAME }}/spring-boot-app:latest
          EOF
